[project]
name = "tabpfn-common-utils"
dynamic = ["version"]
description = "Utilities shared between TabPFN codebases"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Prior Labs", email = "hello@priorlabs.ai"}
]
maintainers = [
    {name = "Prior Labs", email = "hello@priorlabs.ai"}
]
keywords = ["tabpfn", "utilities", "machine-learning"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.9"
dependencies = [
    "typing-extensions>=4.12",
    "posthog>=6.7",
    "platformdirs>=4",
    "filelock>=3.19.1",
    "requests>=2.32.5",
    "nvidia-ml-py>=13.590.48",
]

[project.optional-dependencies]
telemetry-interactive = []
# Needed only by the dataset/array helpers (utils.py dataset functions,
# regression_pred_result, expense_estimation), which import these lazily or
# are not part of the telemetry path. Slim consumers (API services) can
# install the package without the data stack.
datasets = [
    "numpy>=1.21.6",
    "pandas>=1.4.0",
    "scikit-learn>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/priorlabs/tabpfn_common_utils"
Issues = "https://github.com/priorlabs/tabpfn_common_utils/issues"

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabpfn_common_utils"]

[tool.hatch.build.targets.wheel.force-include]
"src/tabpfn_common_utils/py.typed" = "tabpfn_common_utils/py.typed"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pyright]
include = ["src", "tests"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/tabpfn_common_utils/_version.py"
fallback-version = "0.0.0+dev"
tag-pattern = "^v(?P<version>.+)$"

[dependency-groups]
build = [
  "build>=1.3.0",
  "hatchling>=1.27.0",
  "hatch-vcs>=0.3",
  "twine>=6.1.0",
]
dev = [
  "pyright>=1.1.399",
  "pytest>=8.3.5",
  "pytest-cov>=5",
  "ruff>=0.11.6",
  # The test suite covers the dataset/array helpers, which need the
  # `datasets` extra's stack.
  "tabpfn-common-utils[datasets]",
]
