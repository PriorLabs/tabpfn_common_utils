name: In pull request
on:
  pull_request:
    branches:
      - main

jobs:

  check_python_linting:
    name: Ruff Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned to commit SHA (v3.6.1) since tags are mutable.
      # Ruff is pinned to the uv.lock version that the release workflow's `uv run ruff`
      # uses; otherwise pyproject's `ruff>=` floor resolves to the newest release.
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          src: "."
          version: "0.15.10"
      # Mirror the release workflow's `ruff format --check`, which the default
      # ruff-action command (`check`) does not run.
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          src: "."
          version: "0.15.10"
          args: "format --check"

  check_python_typing:
    name: Python type checking
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
  
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup UV with cache
        id: setup-uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      
      - name: Run Pyright
        run: |
          uv sync --group dev
          uv run pyright

  test_compatibility:
    name: Test Python Compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build.
          - os: ubuntu-24.04
            python-version: "3.9"
          # We need x86 as ARM is python>= 3.11 only.
          # https://github.com/actions/setup-python/issues/855
          - os: macos-15-intel
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup UV with cache
        id: setup-uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Install dev extras so pytest is available.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Tests
        run: uv run pytest -q
