name: In pull request
on:
  pull_request:
    branches:
      - main

jobs:

  check_python_linting:
    name: Ruff Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to commit SHA (v3.6.1) since tags are mutable.
      # Ruff is pinned to the uv.lock version that the release workflow's `uv run ruff`
      # uses; otherwise pyproject's `ruff>=` floor resolves to the newest release.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "."
          version: "0.15.10"
      # Mirror the release workflow's `ruff format --check`, which the default
      # ruff-action command (`check`) does not run.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "."
          version: "0.15.10"
          args: "format --check"

  check_python_typing:
    name: Python type checking
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
  
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup UV with cache
        id: setup-uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      
      - name: Run Pyright
        run: |
          uv sync --group dev
          uv run pyright

  test_compatibility:
    name: Test Python Compatibility
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build.
          - os: ubuntu-24.04
            python-version: "3.9"
          # We need x86 as ARM is python>= 3.11 only.
          # https://github.com/actions/setup-python/issues/855
          - os: macos-15-intel
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup UV with cache
        id: setup-uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # Install dev extras so pytest is available.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Tests
        run: uv run pytest -q
